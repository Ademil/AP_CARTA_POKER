scenarios:
  # Cenário 1: Fluxo normal de usuário
  normal-user-flow:
    executor: ramping-vus
    stages:
      - duration: "5m"
        target: 50
      - duration: "10m"
        target: 100
      - duration: "5m"
        target: 50
      - duration: "2m"
        target: 0
    exec: "normalUserTest"
    env:
      USER_ROLE: "engenheiro"
  
  # Cenário 2: Criação intensiva de laudos
  laudo-creation-stress:
    executor: constant-vus
    vus: 50
    duration: "15m"
    exec: "laudoCreationTest"
    env:
      TEST_TYPE: "stress"
  
  # Cenário 3: Consulta de normas
  norma-query-load:
    executor: per-vu-iterations
    vus: 100
    iterations: 100
    maxDuration: "10m"
    exec: "normaQueryTest"
  
  # Cenário 4: Upload de arquivos
  file-upload-test:
    executor: shared-iterations
    vus: 20
    iterations: 200
    maxDuration: "10m"
    exec: "fileUploadTest"
  
  # Cenário 5: Teste de pico
  spike-test:
    executor: ramping-arrival-rate
    stages:
      - duration: "2m"
        target: 100
      - duration: "1m"
        target: 500
      - duration: "2m"
        target: 500
      - duration: "1m"
        target: 1000
      - duration: "2m"
        target: 1000
      - duration: "5m"
        target: 100
    exec: "spikeTest"
  
  # Cenário 6: Teste de resistência
  endurance-test:
    executor: constant-arrival-rate
    rate: 50
    timeUnit: "1m"
    duration: "1h"
    preAllocatedVUs: 20
    maxVUs: 100
    exec: "enduranceTest"

test-scripts:
  normalUserTest: |
    import { group, check } from 'k6/http';
    
    export default function() {
      group('Login', () => {
        // Implementação do teste
      });
      
      group('Dashboard', () => {
        // Implementação do teste
      });
    }
  
  laudoCreationTest: |
    export default function() {
      // Foco em criação de laudos
    }
  
  normaQueryTest: |
    export default function() {
      // Foco em consulta de normas
    }

thresholds:
  global:
    - http_req_duration: ["p(95)<2000", "p(99)<5000"]
    - http_req_failed: ["rate<0.01"]
    - http_reqs: ["count>1000"]
  
  by-scenario:
    normal-user-flow:
      http_req_duration: ["p(95)<1500"]
      checks: ["rate>0.99"]
    
    spike-test:
      http_req_duration: ["p(95)<3000"]
      http_req_failed: ["rate<0.05"]

environments:
  staging:
    BASE_URL: "https://staging.sst.com"
    API_KEY: "${STAGING_API_KEY}"
  
  production:
    BASE_URL: "https://api.sst.com"
    API_KEY: "${PROD_API_KEY}"
  
  load:
    BASE_URL: "https://loadtest.sst.com"
    API_KEY: "${LOADTEST_API_KEY}"

reports:
  html:
    output: "reports/load-test-${__ENV.ENV}-${__ENV.TIMESTAMP}.html"
    title: "SST Load Test Report"
  
  json:
    output: "reports/metrics-${__ENV.ENV}-${__ENV.TIMESTAMP}.json"
  
  influxdb:
    url: "http://influxdb:8086"
    database: "k6"
    tags:
      test_type: "load"
      environment: "${__ENV.ENV}"

monitoring:
  prometheus:
    url: "http://prometheus:9090"
    metrics:
      - k6_http_req_duration
      - k6_http_reqs
      - k6_vus
  
  grafana:
    dashboard: "k6-load-testing"
    annotations: true